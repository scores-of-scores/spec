# Features in the category "Notation & repertoire". IDs are fmt.<slug> and permanent. Status vocabulary: formats.yaml. Sources: sources.yaml.
- id: fmt.mensural
  feature: Mensural notation as a semantic system
  question: A mensuration sign can govern duration rather than merely decorate a modern time signature.
  tags:
  - mensural
  - early
  - renaissance
  - proportions
  importance: 3
  cells:
    krn:
      status: extension
      summary: Use **mens, not **kern
      mechanism: Humdrum has a separate **mens representation for mensural signs, durations and related features.
      caveat: Label this as an adjacent representation, not a core KRN capability.
      workaround: ''
      evidence: documented
      sources:
      - krn-mens
      subset: 'Humdrum extension: **mens representation'
    musicxml:
      status: workaround
      summary: Modern transcription / symbols
      mechanism: Use modern durations and visual approximations, retaining mensural interpretation externally.
      caveat: A historical glyph does not introduce mensural duration semantics.
      workaround: ''
      evidence: inference
      sources:
      - mx-other-notation
      subset: ''
    musescore:
      status: workaround
      summary: Display substitution
      mechanism: The handbook describes mensural signs as display-only substitutions over conventional metre.
      caveat: They do not change the duration ratios between note values.
      workaround: ''
      evidence: documented
      sources:
      - ms-mensural
      subset: ''
    mei:
      status: direct
      summary: Dedicated mensural module
      mechanism: MEI models mensuration, proportion and context-sensitive duration distinctions.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-mensural
      subset: ''
