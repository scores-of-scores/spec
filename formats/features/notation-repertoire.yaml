- id: fmt.fingering
  feature: Printed fingering
  importance: 3
  question: 'Printed finger numbers are a mark of their own: each format stores them as an element, a spine or a
    text object, or not at all.'
  tags:
  - fingering
  - technique
  - performance
  - marks
  cells:
    krn:
      status: extension
      summary: Separate **fing spine
      mechanism: Fingering is not part of the core **kern note vocabulary. Humdrum allows further typed spines beside
        **kern, and a **fing spine is used for fingering in VHV-based practice.
      caveat: The **fing definition itself was not reviewed. The spine model is documented; its use for fingering
        is inferred from VHV usage reports.
      workaround: Record the fingering in a comment or an external annotation keyed to the note.
      evidence: inference
      sources:
      - krn-syntax
      - krn-core
      subset: 'Humdrum extension: **fing spine'
    musicxml:
      status: direct
      summary: fingering inside technical
      mechanism: fingering sits inside technical within notations. The alternate and substitution attributes mark
        alternative or substituted fingerings.
      caveat: Fretted instruments use fingering for the fretting finger and a separate pluck element for the plucking
        finger.
      workaround: ''
      evidence: documented
      sources:
      - mx-fingering
      subset: ''
    musescore:
      status: direct
      summary: Fingering text objects
      mechanism: Fingering symbols come from the Fingering palette (some are repeated in the Guitar palette). They
        are text elements with their own text-style classes.
      caveat: Fingering is a text-based object. Whether it converts to a fingering element in other formats was
        not tested.
      workaround: ''
      evidence: documented
      sources:
      - ms-fingering
      subset: ''
    mei:
      status: direct
      summary: fing and fingGrp
      mechanism: fing encodes one finger and fingGrp groups individual fingers, both in the MEI.fingering module.
      caveat: 'Fingering is its own element, not an articulation value: the guidelines direct fingerings to fing,
        not to the artic attribute.'
      workaround: ''
      evidence: documented
      sources:
      - mei-fing
      subset: ''
