- id: fmt.time-signature-symbol
  feature: Common and cut time symbols versus numeric signatures
  importance: 2
  question: A printed C or cut C and the numeric 4/4 or 2/2 give the same metre but are different printed notations.
  tags:
  - time signature
  - common time
  - cut time
  - meter symbol
  - alla breve
  cells:
    krn:
      status: qualified
      summary: '*M plus *met tandem'
      mechanism: '*M4/4 gives the meter. A separate *met(c) or *met(c|) tandem interpretation records the common-
        or cut-time symbol.'
      caveat: The symbol is a second token, so a file can state the numeric meter without it.
      workaround: ''
      evidence: documented
      sources:
      - krn-ccarh-format
      - krn-timesig
      subset: ''
    musicxml:
      status: direct
      summary: symbol attribute of time
      mechanism: The symbol attribute of time takes common, cut, single-number or normal, separately from the beats
        and beat-type values.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mx-time
      subset: ''
    musescore:
      status: direct
      summary: Time signature symbols
      mechanism: The Time signatures palette offers common and cut time symbols alongside numeric signatures.
      caveat: Stated from the handbook section on time signatures; the symbol entries were not checked line by line.
      workaround: ''
      evidence: inference
      sources:
      - ms-timesig
      subset: ''
    mei:
      status: direct
      summary: sym on meterSig
      mechanism: The sym attribute (and meter.sym on scoreDef and staffDef) takes common or cut and marks that a
        symbol is used instead of a numeric signature.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-metersign
      subset: ''
