  - incomplete
  - metcon
  importance: 2
  cells:
    krn:
      status: qualified
      summary: Encode actual events
      mechanism: Durations and bar markers are explicit; metre-conformance checks remain separate.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - krn-rhythm
      subset: ''
    musicxml:
      status: direct
      summary: Implicit measure plus durations
      mechanism: implicit can suppress the measure number; encoded events determine content rather than the printed
        number alone.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mx-measure
      subset: ''
    musescore:
      status: direct
      summary: Actual versus nominal duration
      mechanism: Measure properties allow an actual duration differing from the time signature.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - ms-irregular
      subset: ''
    mei:
      status: direct
      summary: Metrical conformance metadata
