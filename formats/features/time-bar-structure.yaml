# Features in the category "Time & bar structure". IDs are fmt.<slug> and permanent. Status vocabulary: formats.yaml. Sources: sources.yaml.
- id: fmt.equal-span-polymetre
  feature: Different metres over a shared bar span
  question: 'Example: 18/16 in one staff against 3/4 in another, with coincident barlines.'
  tags:
  - polymetre
  - polymeter
  - simultaneous
  - time
  - signatures
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Separate meter interpretations
      mechanism: Meter indications can differ by spine; encode durations so synchronisation is explicit.
      caveat: Different labels alone do not rescale elapsed time.
      workaround: ''
      evidence: inference
      sources:
      - krn-timesig
      subset: ''
    musicxml:
      status: qualified
      summary: Staff-specific time signatures
      mechanism: time/@number scopes the signature; actual durations and time modification must express the common
        span.
      caveat: The numerator alone does not determine a tempo ratio.
      workaround: ''
      evidence: documented
      sources:
      - mx-time
      subset: ''
    musescore:
      status: direct
      summary: Local time signatures
      mechanism: Local signatures stretch the notated content into the global bar span, like an invisible tuplet.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - ms-timesig
      subset: ''
    mei:
      status: qualified
      summary: Staff-specific definitions
      mechanism: staffDef can hold a distinct meter; durations/proportions must establish the intended synchronisation.
      caveat: Validate the rendering and temporal interpretation.
      workaround: ''
      evidence: documented
      sources:
      - mei-staffDef
      subset: ''
- id: fmt.independent-bars
  feature: Simultaneous bars of differing lengths
  question: 'Example: 3/4 and 4/4 at the same quarter-note pulse; barlines meet every 12 quarters.'
  tags:
  - polymetre
  - polymeter
  - independent
  - asynchronous
  - bars
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Union of boundaries
      mechanism: The documented VHV polymeter example inserts barline records at the combined boundaries and uses
        invisible =- in unaffected spines.
      caveat: These extra structural boundaries can affect analysis.
      workaround: ''
      evidence: documented
      sources:
      - krn-poly
      subset: ''
    musicxml:
      status: qualified
      summary: Non-controlling measures
      mechanism: Partwise measures support non-controlling="yes" for a left boundary not aligned with other parts.
      caveat: The flag describes the left boundary. Receiving applications may still force common measure boundaries.
      workaround: ''
      evidence: documented
      sources:
      - mx-measure
      subset: ''
    musescore:
      status: workaround
      summary: No independent bar lengths
      mechanism: Local time signatures keep the global bar duration.
      caveat: ''
      workaround: Use a common subdivision grid or longer shared containers, hide unwanted boundaries and draw local
        barlines where needed. Repair numbering and retain local bar identities separately.
      evidence: documented
      sources:
      - ms-timesig
      subset: ''
    mei:
      status: qualified
      summary: Non-controlling bar structure
      mechanism: barLine/control and measure control distinguish alignment points; part-oriented or unmeasured structures
        can express independent boundaries.
      caveat: On measure, control describes the right boundary. Shared measure containers may need restructuring;
        renderer support is not assured.
      workaround: ''
      evidence: inference
      sources:
      - mei-bar
      subset: ''
- id: fmt.polytempo
  feature: Independent simultaneous tempi
  question: Different printed tempo marks are not proof of independently running clocks.
  tags:
  - polytempo
  - asynchronous
  - tempo
  - clocks
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Per-spine tempo metadata
      mechanism: Tandem interpretations can differ across spines.
      caveat: Common record alignment still needs a declared temporal interpretation.
      workaround: Use a common time grid or external performance model.
      evidence: inference
      sources:
      - krn-basic
      subset: ''
    musicxml:
      status: unknown
      summary: Notation possible; clocks unverified
      mechanism: Tempo directions can be written, but independent concurrent playback clocks were not established.
      caveat: ''
      workaround: Encode rational ratios on a shared timeline or retain separate performance data.
      evidence: unverified
      sources:
      - mx-sound
      subset: ''
    musescore:
      status: workaround
      summary: Shared playback timeline
      mechanism: Use tuplets and explicit notation for rational ratios; independent clocks need a separate performance
        workflow.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - ms-timesig
      subset: ''
    mei:
      status: qualified
      summary: Multiple temporal descriptions
      mechanism: Gestural and real-time attributes can describe timing distinct from notation.
      caveat: This does not promise polytempo playback in a renderer.
      workaround: ''
      evidence: inference
      sources:
      - mei-note
      subset: ''
- id: fmt.unmeasured
  feature: Unmeasured or unbarred music
  question: Removing visible barlines is different from removing a measure-based data model.
  tags:
  - cadenza
  - free
  - rhythm
  - unbarred
  - chant
  importance: 3
  cells:
    krn:
      status: direct
      summary: No mandatory visible bars
      mechanism: Event streams can omit barlines; durations remain available for analysis.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - krn-basic
      subset: ''
    musicxml:
      status: qualified
      summary: senza-misura; measure containers remain
      mechanism: A time element may specify senza-misura.
      caveat: Music still lives in measure containers; choose boundaries deliberately.
      workaround: ''
      evidence: documented
      sources:
      - mx-time
      subset: ''
    musescore:
      status: workaround
      summary: Hidden boundaries or long measures
      mechanism: Hide signatures/barlines, or create irregular measures.
      caveat: The score still behaves as measures internally.
      workaround: ''
      evidence: documented
      sources:
      - ms-mensural
      subset: ''
    mei:
      status: direct
      summary: Unmeasured structures
      mechanism: MEI supports music organised without CMN measure containers, including historical repertoires.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-shared
      subset: ''
