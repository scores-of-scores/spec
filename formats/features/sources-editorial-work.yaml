# Features in the category "Sources & editorial work". IDs are fmt.<slug> and permanent. Status vocabulary: formats.yaml. Sources: sources.yaml.
- id: fmt.editorial-accidentals
  feature: Editorial accidentals / musica ficta
  question: Encode both the musical alteration and its editorial status.
  tags:
  - editorial
  - ficta
  - accidental
  - brackets
  importance: 3
  cells:
    krn:
      status: extension
      summary: RDF convention in VHV
      mechanism: Declare an editorial-accidental signifier, commonly i, in !!!RDF**kern.
      caveat: This is a named convention, not a universal meaning of the letter i.
      workaround: ''
      evidence: documented
      sources:
      - krn-editorial
      subset: VHV / RDF
    musicxml:
      status: direct
      summary: Editorial flag and enclosure
      mechanism: accidental separates the printed symbol from pitch alteration; editorial, bracket and parentheses
        convey its treatment.
      caveat: Importer support must be tested.
      workaround: ''
      evidence: documented
      sources:
      - mx-accidental
      subset: ''
    musescore:
      status: qualified
      summary: Appearance is editable
      mechanism: Accidental/notehead enclosures can mark an intervention visually.
      caveat: A bracket does not itself identify an editor, source or conjecture.
      workaround: ''
      evidence: inference
      sources:
      - ms-noteheads
      subset: ''
    mei:
      status: direct
      summary: Symbol and intervention model
      mechanism: accid records accidental information; supplied and responsibility markup can state an editorial
        intervention.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-accid
      - mei-supplied
      subset: ''
- id: fmt.editorial-status
  feature: Sic, interpretation and intervention
  question: Preserve the reason a reading differs from the apparent source.
  tags:
  - sic
  - correction
  - intervention
  - editorial
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Core editorial signifiers
      mechanism: Original **kern defines Y, x, X and ? for editorial distinctions.
      caveat: Modern VHV uses X for forced accidental display; declare conventions before mixing encodings.
      workaround: ''
      evidence: documented
      sources:
      - krn-core
      subset: ''
    musicxml:
      status: qualified
      summary: Descriptive editorial level
      mechanism: level carries editorial status text and enclosure attributes.
      caveat: No equivalent typed hierarchy of sic/corr alternatives is supplied here.
      workaround: ''
      evidence: documented
      sources:
      - mx-level
      subset: ''
    musescore:
      status: workaround
      summary: Text and visual coding
      mechanism: Explain editorial categories with text, styles or a separate apparatus.
      caveat: Readers cannot infer a scholarly ontology from colour or italics.
      workaround: ''
      evidence: inference
      sources:
      - ms-props
      subset: ''
    mei:
      status: direct
      summary: Typed editorial wrappers
      mechanism: sic/corr and orig/reg express distinct editorial acts; choice can retain both alternatives.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-choice
      subset: ''
- id: fmt.critical-apparatus
  feature: Multiple witnesses and alternative readings
  question: Alternatives should remain alternatives, rather than simultaneous performed notes.
  tags:
  - apparatus
  - witness
  - variant
  - lemma
  - readings
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Strophes / external apparatus
      mechanism: Humdrum strophes can retain alternative versions.
      caveat: Witness relationships and reading selection need a documented project model.
      workaround: ''
      evidence: documented
      sources:
      - krn-repeats
      subset: ''
    musicxml:
      status: workaround
      summary: One reading plus commentary
      mechanism: Keep the selected score and describe variants in footnotes or linked material.
      caveat: An ossia is not a general critical apparatus.
      workaround: ''
      evidence: inference
      sources:
      - mx-footnote
      subset: ''
    musescore:
      status: workaround
      summary: Separate readings or ossias
      mechanism: Use separate scores/staves and an external apparatus for witness comparisons.
      caveat: Avoid making every reading sound simultaneously.
      workaround: ''
      evidence: inference
      sources:
      - ms-parts
      subset: ''
    mei:
      status: direct
      summary: app / lem / rdg
      mechanism: A critical apparatus groups lemma and readings with source attribution.
      caveat: A renderer needs a reading-selection policy.
      workaround: ''
      evidence: documented
      sources:
      - mei-app
      subset: ''
- id: fmt.responsibility
  feature: Responsibility for individual interventions
  question: Who supplied this note, rather than who edited the whole file?
  tags:
  - editor
  - resp
  - provenance
  - attribution
  importance: 3
  cells:
    krn:
      status: extension
      summary: Comment or associated spine
      mechanism: Attach responsibility using a defined annotation convention; reference records identify contributors
        at document level.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - krn-refs
      subset: 'Project convention: comment or associated spine'
    musicxml:
      status: workaround
      summary: Editorial text plus IDs
      mechanism: Associate a note with explanatory level/footnote content or external attribution.
      caveat: Use an explicit project convention for machine-readable responsibility.
      workaround: ''
      evidence: inference
      sources:
      - mx-level
      subset: ''
    musescore:
      status: workaround
      summary: External or visible attribution
      mechanism: Project creator tags do not establish per-intervention scholarly responsibility.
      caveat: ''
      workaround: Maintain an apparatus keyed to score locations.
      evidence: inference
      sources:
      - ms-props
      subset: ''
    mei:
      status: direct
      summary: resp references
      mechanism: Responsibility attributes can identify the person or agency responsible for an editorial act.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-edit
      subset: ''
