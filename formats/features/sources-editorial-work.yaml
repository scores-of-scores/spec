      - krn-refs
      subset: 'Project convention: external image-region mapping'
    musicxml:
      status: qualified
      summary: Links, not a facsimile model
      mechanism: link/bookmark can associate resources and locations.
      caveat: Image zones and surface relationships require a project convention.
