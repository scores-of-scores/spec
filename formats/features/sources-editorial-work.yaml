      workaround: ''
      evidence: inference
      sources:
      - krn-fret
      subset: 'Project convention: annotations or an associated spine'
    musicxml:
      status: workaround
      summary: Narrative confidence
      mechanism: Explain uncertainty using editorial level/footnote text; retain any numeric model externally.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - mx-level
      subset: ''
    musescore:
      status: workaround
      summary: Appearance plus explanation
      mechanism: Use notation/text for readers and an external record for structured confidence.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - ms-symbols
      subset: ''
    mei:
      status: direct
      summary: cert and confidence
      mechanism: Editorial markup can carry qualitative certainty and, on applicable elements, numeric confidence.
      caveat: Check attribute availability in the selected customization.
      workaround: ''
      evidence: documented
      sources:
      - mei-supplied
      subset: ''
- id: fmt.gaps-damage
  feature: Missing, illegible and supplied material
  question: A lost passage, an unreadable passage and an editorial completion are different claims.
  tags:
  - lacuna
  - damage
  - gap
  - unclear
  - supplied
  importance: 3
  cells:
    krn:
      status: workaround
      summary: Do not use rests for loss
      mechanism: Represent loss through a declared annotation convention; distinguish musical silence from missing
        evidence.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - krn-refs
      subset: ''
    musicxml:
      status: workaround
      summary: Editorial explanation
      mechanism: A performance rest does not mean a damaged source; explain the gap and any reconstruction separately.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - mx-footnote
      subset: ''
    musescore:
      status: workaround
      summary: Text and reconstructed score
      mechanism: Retain damage information outside the sounding reconstruction or in visible notes.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - ms-symbols
      subset: ''
    mei:
      status: direct
      summary: gap / unclear / supplied
      mechanism: Different elements distinguish omission, uncertain reading and editorial replacement; attributes
        qualify extent and cause.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-edit
      subset: ''
- id: fmt.genetic-editing
  feature: Deletions, additions and revision layers
  question: Describe changes on the manuscript, not only the editor’s final reading.
  tags:
  - genetic
  - revision
  - deletion
  - addition
  - manuscript
  importance: 2
  cells:
    krn:
      status: extension
      summary: Custom linked descriptions
      mechanism: Alternative streams and annotations can document revisions under a local model.
      caveat: No claim of a standard genetic-editing ontology.
      workaround: ''
      evidence: inference
      sources:
      - krn-repeats
      subset: 'Project convention: linked alternative streams and annotations'
    musicxml:
      status: workaround
      summary: External revision evidence
      mechanism: Use links or supplementary documentation for manuscript operations.
      caveat: Score editing history is not manuscript revision history.
      workaround: ''
      evidence: inference
      sources:
      - mx-link
      subset: ''
    musescore:
      status: workaround
      summary: Separate evidence record
      mechanism: Application edits produce a score; document scribal/compositional revisions separately.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - ms-props
      subset: ''
    mei:
      status: direct
      summary: add / del / subst
      mechanism: MEI distinguishes visible source changes from editorial correction and supports genetic textual
        work.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-edit
      subset: ''
- id: fmt.diplomatic-normalized
  feature: Diplomatic versus normalized views
  question: Keep original and regularized forms together without overwriting the source.
  tags:
  - diplomatic
  - normalized
  - original
  - regularized
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Alternatives and conventions
      mechanism: Use alternative sections/strophes or documented original/modernized conventions.
      caveat: Extraction rules must specify which view is intended.
      workaround: ''
      evidence: documented
      sources:
      - krn-repeats
      subset: ''
    musicxml:
      status: workaround
      summary: Separate views
      mechanism: Store separate score versions or linked originals and explanations.
      caveat: A selected appearance alone does not retain both interpretations.
      workaround: ''
      evidence: inference
      sources:
      - mx-link
      subset: ''
    musescore:
      status: workaround
      summary: Parallel projects or staves
      mechanism: Maintain distinct views and document how edits propagate.
      caveat: Linked performance parts are not editorial-choice containers.
      workaround: ''
      evidence: inference
      sources:
      - ms-parts
      subset: ''
    mei:
      status: direct
      summary: choice with orig / reg
      mechanism: Retain original and regularized encodings within a choice.
      caveat: Rendering/extraction software must choose a branch.
      workaround: ''
      evidence: documented
      sources:
      - mei-choice
      subset: ''
