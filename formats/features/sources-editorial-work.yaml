- id: fmt.edition-selection
  feature: Producing a performable reading from an edition
  question: Retaining alternatives and selecting one for playback are separate operations.
  tags:
  - selection
  - rendering
  - apparatus
  - playback
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Explicit extraction policy
      mechanism: Section and strophe tools can select an interpretation before further processing.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - krn-repeats
      subset: ''
    musicxml:
      status: qualified
      summary: Usually already selected
      mechanism: The interchange score generally represents a chosen musical text.
      caveat: Preserve the apparatus elsewhere if selecting loses evidence.
      workaround: ''
      evidence: inference
      sources:
      - mx-spec
      subset: ''
    musescore:
      status: qualified
      summary: Performance project
      mechanism: Create a playing score from the selected reading; keep documentary information outside that reduction.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - ms-export
      subset: ''
    mei:
      status: qualified
      summary: Selection is a processing step
      mechanism: app/choice preserve alternatives; consumers must define which reading becomes the score.
      caveat: Schema validity does not determine an editorial policy.
      workaround: ''
      evidence: documented
      sources:
      - mei-app
      - mei-choice
      subset: ''
