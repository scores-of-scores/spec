# Features in the category "Engraving & presentation". IDs are fmt.<slug> and permanent. Status vocabulary: formats.yaml. Sources: sources.yaml.
- id: fmt.page-breaks
  feature: Page/system breaks and spacing
  question: Encoding a break does not guarantee identical pagination in another engine.
  tags:
  - engraving
  - pagination
  - breaks
  - spacing
  importance: 3
  cells:
    krn:
      status: extension
      summary: Renderer layout conventions
      mechanism: VHV rendering conventions supplement the symbolic stream.
      caveat: Core **kern is not a page-layout language.
      workaround: ''
      evidence: inference
      sources:
      - krn-system
      subset: VHV rendering conventions
    musicxml:
      status: qualified
      summary: print and layout defaults
      mechanism: print supplies local page/system/staff parameters; defaults supplies score-wide choices.
      caveat: Engravers may calculate different spacing.
      workaround: ''
      evidence: documented
      sources:
      - mx-print
      subset: ''
    musescore:
      status: direct
      summary: Native layout controls
      mechanism: System breaks and spacing controls are retained in the project.
      caveat: Interchange may recalculate the result.
      workaround: ''
      evidence: documented
      sources:
      - ms-layout
      subset: ''
    mei:
      status: qualified
      summary: Breaks and layout attributes
      mechanism: MEI offers layout descriptions; rendering remains a separate process.
      caveat: Source breaks and desired output breaks should be distinguished.
      workaround: ''
      evidence: documented
      sources:
      - mei-shared
      subset: ''
- id: fmt.exact-appearance
  feature: Exact visual reproduction
  question: Preserving musical meaning is not a promise of pixel-identical output.
  tags:
  - facsimile
  - pixel
  - fidelity
  - archive
  - rendering
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Keep a reference rendering
      mechanism: The notation output depends on the selected rendering conventions and implementation.
      caveat: ''
      workaround: ''
      evidence: inference
      sources:
      - krn-system
      subset: ''
    musicxml:
      status: qualified
      summary: Layout hints, not fixed artwork
      mechanism: Applications may reflow even when importing page/system breaks.
      caveat: Archive PDF/SVG for the approved appearance.
      workaround: ''
      evidence: documented
      sources:
      - ms-xml
      subset: ''
    musescore:
      status: qualified
      summary: Best within matched environment
      mechanism: Native controls preserve intent; fonts and application changes can alter output.
      caveat: ''
      workaround: Keep a rendered reference and record the application build.
      evidence: inference
      sources:
      - ms-fonts
      subset: ''
    mei:
      status: qualified
      summary: Logical score or source facsimile
      mechanism: Facsimiles preserve source images; semantic encoding alone does not fix all rendering choices.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-facsimile
      subset: ''
