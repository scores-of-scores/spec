- id: fmt.stem-direction
  feature: 'Stem direction: explicit or automatic'
  importance: 2
  question: An explicit stem direction and an automatic one are different statements, and an explicit value may
    outlast a transposition or clef change.
  tags:
  - stem
  - direction
  - default
  - override
  - transposition
  - auto
  cells:
    krn:
      status: direct
      summary: Optional / and \ signifiers
      mechanism: A / or \ signifier on a note token gives stem up or down. Stem direction is one optional component
        of a note token.
      caveat: Without a signifier the direction is not stated; any direction shown is then a rendering matter.
      workaround: ''
      evidence: documented
      sources:
      - krn-help
      subset: ''
    musicxml:
      status: direct
      summary: 'stem: up, down, none, double'
      mechanism: stem is an optional child of note whose values are down, up, none and double. Position attributes
        can also set the stem end.
      caveat: none and double are distinct statements. An absent stem element leaves the direction to the receiving
        application.
      workaround: ''
      evidence: documented
      sources:
      - mx-stem
      subset: ''
    musescore:
      status: direct
      summary: Auto, Up or Down
      mechanism: Stem direction is a property with Auto (set by voice and context), Up and Down. Up and Down override
        the default.
      caveat: Community reports say an explicit Up or Down is kept after transposition while Auto is recomputed.
        The handbook states only that Up and Down override the default; this was not tested.
      workaround: Leave the property on Auto unless the source direction has to be kept.
      evidence: documented
      sources:
      - ms-stems
      subset: ''
    mei:
      status: direct
      summary: stem.dir on note and chord
      mechanism: stem.dir (att.stems) records stem direction on note and chord. The stem element also has a dir
        attribute.
      caveat: data.STEMDIRECTION has basic values (up, down) and an extended set.
      workaround: ''
      evidence: documented
      sources:
      - mei-stems
      subset: ''
