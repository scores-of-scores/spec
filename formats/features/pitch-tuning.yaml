  - percussion
  - unpitched
  - drum
  - display
  importance: 2
  cells:
    krn:
      status: extension
      summary: VHV percussion conventions
      mechanism: Humdrum rendering uses percussion conventions for pitch, head shape and instrument interpretation.
      caveat: Do not treat staff position as an ordinary tonal pitch.
      workaround: ''
      evidence: documented
      sources:
      - krn-percussion
      subset: VHV
    musicxml:
      status: direct
      summary: unpitched coordinates
      mechanism: unpitched uses display-step/display-octave; instrument information supplies the playback identity.
      caveat: ''
      workaround: ''
      evidence: documented
