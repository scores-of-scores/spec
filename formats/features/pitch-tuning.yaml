# Features in the category "Pitch & tuning". IDs are fmt.<slug> and permanent. Status vocabulary: formats.yaml. Sources: sources.yaml.
- id: fmt.written-sounding
  feature: Written versus sounding pitch
  question: Transposing parts can preserve spelling while using different pitch coordinates.
  tags:
  - transposing
  - spelling
  - concert
  - sounding
  importance: 3
  cells:
    krn:
      status: direct
      summary: Sounding pitch baseline
      mechanism: '**kern records sounding pitch; *ITr describes how to produce a transposed written part.'
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - krn-transpose
      subset: ''
    musicxml:
      status: direct
      summary: Written pitch plus transpose
      mechanism: transpose specifies the interval added to written pitch to obtain sounding pitch.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mx-transpose
      subset: ''
    musescore:
      status: direct
      summary: Concert/transposed display
      mechanism: The application provides concert-pitch and transposed views.
      caveat: Keep instrument transposition distinct from actually transposing the notes.
      workaround: ''
      evidence: documented
      sources:
      - ms-transpose
      subset: ''
    mei:
      status: direct
      summary: Written and gestural information
      mechanism: staffDef transposition and note gestural attributes distinguish written and sounding descriptions.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-staffDef
      - mei-note
      subset: ''
- id: fmt.visual-accidental
  feature: Printed accidental versus effective pitch
  question: A sharp in the encoding does not necessarily mean a printed sharp symbol.
  tags:
  - accidental
  - courtesy
  - cautionary
  - sounding
  - spelling
  importance: 3
  cells:
    krn:
      status: qualified
      summary: Pitch explicit; display derived
      mechanism: Every pitch carries its alteration; VHV computes visibility, with X/y display controls.
      caveat: Suppressing a symbol must not erase its pitch alteration.
      workaround: ''
      evidence: documented
      sources:
      - krn-start
      subset: ''
    musicxml:
      status: direct
      summary: alter versus accidental
      mechanism: Pitch alteration and the actual printed accidental are distinct elements.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mx-alter
      - mx-accidental
      subset: ''
    musescore:
      status: qualified
      summary: Notation and playback properties
      mechanism: Notation controls coexist with playback tuning and note properties.
      caveat: Verify cautionary-symbol import separately from sounding pitch.
      workaround: ''
      evidence: inference
      sources:
      - ms-noteheads
      subset: ''
    mei:
      status: direct
      summary: accid versus accid.ges
      mechanism: Written and gestural inflections can differ.
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - mei-accid
      subset: ''
- id: fmt.microtones
  feature: Microtonal pitch and accidental glyphs
  question: A quarter-tone glyph, an exact pitch and its playback are three separate tests.
  tags:
  - microtone
  - quarter-tone
  - tuning
  - cents
  importance: 3
  cells:
    krn:
      status: extension
      summary: Use other pitch spines
      mechanism: '**cents can express fractional-semitone values alongside **kern.'
      caveat: That is Humdrum extensibility, not native microtonal **kern spelling.
      workaround: ''
      evidence: documented
      sources:
      - krn-cents
      subset: 'Humdrum extension: **cents spine'
    musicxml:
      status: direct
      summary: Decimal semitone alteration
      mechanism: alter permits decimal values; the accidental vocabulary supplies notational symbols.
      caveat: Playback and uncommon glyph support vary.
      workaround: ''
      evidence: documented
      sources:
      - mx-alter
      subset: ''
    musescore:
      status: qualified
      summary: Symbols plus cents tuning
      mechanism: Note properties offer playback tuning in cents.
      caveat: Sound-engine behaviour is version-dependent and untested here; do not infer it from the symbol.
      workaround: ''
      evidence: documented
      sources:
      - ms-noteheads
      subset: ''
    mei:
      status: qualified
      summary: Notated and gestural pitch
      mechanism: Accidental vocabularies and gestural pitch support distinctions beyond ordinary semitone notation.
      caveat: Exact tuning and glyph rendering depend on profile and consumer.
      workaround: ''
      evidence: documented
      sources:
      - mei-accid
      subset: ''
- id: fmt.temperament
  feature: Temperament and exact frequency
  question: A note name alone does not determine a frequency without a tuning model.
  tags:
  - temperament
  - frequency
  - just
  - tuning
  importance: 2
  cells:
    krn:
      status: extension
      summary: Frequency or cents streams
      mechanism: '**freq explicitly encodes hertz; it can coexist with symbolic notation.'
      caveat: ''
      workaround: ''
      evidence: documented
      sources:
      - krn-freq
      subset: 'Humdrum extension: **freq spine'
    musicxml:
      status: qualified
      summary: Explicit altered pitches
      mechanism: Decimal alterations encode offsets, but a general temperament system is not supplied by that field
        alone.
      caveat: ''
      workaround: Document the tuning reference and conversion rules.
      evidence: inference
      sources:
      - mx-alter
      subset: ''
    musescore:
      status: qualified
      summary: Per-note tuning workflow
      mechanism: Cents adjustments can implement a tuning in compatible playback setups.
      caveat: Retain tuning assumptions and test the sound engine.
      workaround: ''
      evidence: inference
      sources:
      - ms-noteheads
      subset: ''
    mei:
      status: qualified
      summary: Tuning metadata
      mechanism: staffDef includes tune.Hz, tune.pname and tune.temper.
      caveat: The consumer must implement the specified tuning.
      workaround: ''
      evidence: documented
      sources:
      - mei-staffDef
      subset: ''
