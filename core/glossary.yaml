# Glossary: the terms used in the rules, documents and paper. Generated into docs/glossary.md.
terms:
  - term: Source
    meaning: The notated document being transcribed, one edition or one manuscript, identified by file and pages.
  - term: Transcription
    meaning: The digital encoding of one source, made under a profile. Also the name of the tier of decisions that need no judgement and no second source.
  - term: Encoding
    meaning: A file or set of files that records a transcription in one format.
  - term: Format
    meaning: A specification that defines how music is encoded (KRN, MusicXML, MEI, MuseScore's native MSCX). A format sets what can be expressed. It is not the same as an application that reads or writes it.
  - term: Application
    meaning: A program such as MuseScore, whose defaults act as a house style that the format does not set.
  - term: Version of record (VoR)
    meaning: The exact transcription of one source, errors included, identified by a pinned version.
  - term: Tier
    meaning: One of three kinds of decision. Transcription needs no musical judgement and no second source. Presentation is systematic, reversible and changes nothing notated. Editorial needs judgement or another source.
  - term: Normalisation
    meaning: A registered presentation choice such as beam grouping or clefs. The list is closed.
  - term: Profile
    meaning: A project's choices over the core rules, the format of its version of record, and the treatment of marks. In the paper a profile is also called a position.
  - term: Strength
    meaning: MUST, SHOULD, MAY or OFF (BCP 14). MUST is always applied, SHOULD unless there is a recorded reason, MAY at discretion, OFF not adopted. For a normalisation or a correction, OFF means not permitted.
  - term: Format feature
    meaning: One entry in the formats data (fmt.*) that states, for each of four formats, whether and how it can express something, and on what evidence.
  - term: Status
    meaning: The capability label of a format feature cell. Direct, qualified, extension, workaround or unknown. It is not a quality score.
  - term: Unsupported
    meaning: The treatment of a category of printed mark that the profile's format cannot express. Derived from the formats data. It is a limit of the format, not a judgement, and changes when the format or the profile does.
  - term: Observation
    meaning: A point recorded in the report (a possible source error, a divergence, a mark with more than one reading, an unclear tier). It does not change the transcription.
  - term: Clear error
    meaning: A source error that passes the two-part test in correct.error-test. Every other error is kept as printed.
  - term: Correction
    meaning: A change to the printed reading of a clear error, made either in the transcription (correct.in-place) or in a separate layer (correct.layer), and always recorded (correct.record).
  - term: Corrections layer
    meaning: A layer separate from the transcription, pinned to a transcription version, that records corrections. The corrected view is derived from the transcription and the layer.
  - term: Note kinds
    meaning: Presentation (a choice among permitted normalisations), tool (settings that may change between applications), house (a house convention) and editorial (a suggestion for downstream work, never applied in the version of record).
  - term: Sidecar
    meaning: "The machine-readable metadata stored with each transcription: source, pages, tools, versions and the normalisations applied."
  - term: Collation
    meaning: A derived record of where transcriptions of the same work differ, without choosing between them.
  - term: Fixture
    meaning: A defined test situation that exercises format features and, for the worked examples, rules. A feature cell counts as tested only when a fixture covering it has a recorded result for that format.
