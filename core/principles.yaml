# Transcription Principles: core registry.
# Source of truth for the rules. The public table, JSON and CSV are generated from this file
# plus a profile (see tools/build.py). Strengths (MUST/SHOULD/MAY/OFF) and priorities
# are NOT set here; they belong to a profile.
#
# ID policy: <domain>.<slug>. IDs are permanent: never renumbered, never reused.
# A rule whose meaning changes materially gets a new ID; the old one is retired with replaced_by.

principles_version: "2026-11"
title: Transcription Principles

tiers:
  transcription:
    title: Transcription
    test: A competent reader could do it from the source and a stated notational convention, with no musical judgement and no second source.
  presentation:
    title: Presentation
    test: It is systematic, reversible, changes nothing that is notated, and is stated once in the report. Only the registered normalisations qualify.
  editorial:
    title: Editorial
    test: It needs musical judgement or another source. It is not done in the transcription.

treatments:
  transcribe:
    title: Transcribed
    meaning: Printed marks of this category are transcribed.
  editorial:
    title: Editorial
    meaning: Needs musical judgement or another source, so it is not done in the transcription.
  unsupported:
    title: Unsupported
    meaning: Outside what the encoding format expresses. Nothing about it needs judgement; it is left out because of the format, and revisited if the format changes.

domains:
  stance:
    title: Stance
    description: What a transcription is, and is not.
  read:
    title: Reading the source
    description: What is read from the source and transcribed.
  encode:
    title: Encoding
    description: How what is read is encoded.
  normalise:
    title: Normalisation
    description: The closed menu of permitted presentation choices (the presentation tier).
  declare:
    title: Declaration
    description: What must be marked, reported and recorded.

themes:
  aims:         { domain: stance,    title: Aims }
  boundary:     { domain: stance,    title: Boundary }
  fidelity:     { domain: read,      title: Fidelity }
  scope:        { domain: read,      title: Scope of marks }
  text:         { domain: read,      title: Terms and text }
  notation:     { domain: read,      title: Notation }
  objects:      { domain: encode,    title: Musical objects }
  defaults:     { domain: encode,    title: Defaults }
  layout:       { domain: encode,    title: Source layout }
  framework:    { domain: normalise, title: The closed list }
  rhythm:       { domain: normalise, title: Grouping and rhythm }
  signs:        { domain: normalise, title: Signs and placement }
  words:        { domain: normalise, title: Words and terms }
  page:         { domain: normalise, title: Page }
  additions:    { domain: declare,   title: Additions }
  reporting:    { domain: declare,   title: Reporting }
  provenance:   { domain: declare,   title: Provenance }

# Categories of printed mark that are not transcribed by default, and why (see `treatments`).
# A profile can reclassify a category (scope.marks in the profile). Any printed mark that is not
# in a category listed here is transcribed (read.transcribe-all-marks). To add a category,
# propose it here, as for a rule.
mark_categories:
  fingering:
    title: Fingering
    description: Finger numbers and similar hand-position indications printed in the source.
    default_treatment: unsupported
    rationale: Fingering is outside the remit of some basic encoding formats.

rules:
  # ---------------------------------------------------------------- stance
  - id: stance.faithful-reading
    theme: aims
    kind: obligation
    title: Faithful reading
    statement: Reproduce what the source prints, as exactly as the encoding allows. A transcription reads; it does not edit.
    relations: { tension-with: [stance.meaning-over-appearance] }
    aliases: [TP1]

  - id: stance.meaning-over-appearance
    theme: aims
    kind: obligation
    title: Meaning over appearance
    statement: Encode musical meaning in a form that converts, plays back and survives tool changes. Where an exact visual copy conflicts with a standard encoding, use the standard encoding, only through the registered normalisations, and report them.
    rationale: Apps change and formats are converted; meaning travels, appearance does not.
    relations: { requires: [normalise.closed-list, declare.report-deviations] }
    aliases: [TP2]

  - id: stance.judgement-stays-out
    theme: aims
    kind: obligation
    title: Judgement stays out
    statement: Do not choose between readings, correct, complete or interpret. A transcription records; judgement belongs elsewhere.
    rationale: Keeps the record checkable against the source and leaves editorial work to those who own it.
    aliases: [TP4]

  - id: stance.doubt-means-preserve
    theme: boundary
    kind: obligation
    title: In doubt, preserve
    statement: When it is unclear which tier a decision falls in, treat it as editorial. Keep what the source prints, flag the point and ask a reviewer.
    rationale: Split from the earlier TP4, whose second sentence this was.
    relations: { refines: [stance.judgement-stays-out] }

  # ---------------------------------------------------------------- read
  - id: read.preserve-distinctions
    theme: fidelity
    kind: obligation
    title: Preserve the distinctions the source makes
    statement: Where the source uses different notations for what might seem the same, keep the difference (for example common time, cut time and 4/4; ties and slurs; acciaccatura and appoggiatura; key signatures as given).
    aliases: [TP3]

  - id: read.consistency-by-equivalence
    theme: fidelity
    kind: obligation
    title: Consistency means equivalence only
    statement: Encode notations that mean the same thing the same way. Preserve any divergence that might be musical (a different articulation in one part, a different pitch in a repeated passage); do not harmonise it.
    relations: { refines: [stance.judgement-stays-out] }
    aliases: [TP5]

  - id: read.preserve-errors
    theme: fidelity
    kind: obligation
    title: Source errors are preserved
    statement: Transcribe an evident source error as printed and flag it for whoever maintains corrections. Never fix it silently in the transcription.
    relations: { refines: [stance.judgement-stays-out], see-also: [declare.report-deviations] }
    examples:
      - situation: A bar does not add up to the time signature.
        handling: Keep the bar as printed, flag it, and note it as an observation so a correction can be proposed separately.
    aliases: [TP7]

  - id: read.record-source-marks
    theme: fidelity
    kind: obligation
    title: Record the source's own editorial marks
    statement: Brackets and similar marks printed in the source signal an intervention by that edition. Keep the element, record each such mark in the report, and drop the printed mark from the encoding only if the standard encoding requires it.
    relations: { see-also: [declare.report-deviations] }
    aliases: [TP11]

  - id: read.transcribe-all-marks
    theme: scope
    kind: obligation
    title: Transcribe every printed mark
    statement: Transcribe pitches, rhythms and every printed mark, within what the encoding can express. A category of mark that is classed as editorial or unsupported (see mark_categories; a profile may reclassify a category) is left out systematically and stated once in each report.
    relations: { requires: [declare.report-deviations] }
    aliases: [TP6]

  - id: read.source-language
    theme: text
    kind: obligation
    title: Keep the source language
    statement: Keep musical terms and other text in the source language. Translations are additions.
    relations: { tension-with: [read.standard-instructions], see-also: [declare.mark-additions, normalise.terms] }
    aliases: [TP9]

  - id: read.standard-instructions
    theme: text
    kind: obligation
    title: Standard encodings for instructions
    statement: Transcribe printed techniques, strings, mutes and harmonics using the standard encoding where one exists, even where that changes the printed wording.
    rationale: Standard entries drive playback, part extraction and export.
    examples:
      - situation: The source gives the mute instruction in German.
        handling: Use the standard Italian entry (con sord. / senza sord.).
    aliases: [TP10]

  - id: read.composer-led-grouping
    theme: notation
    kind: obligation
    title: Preserve composer-led grouping
    statement: Preserve beaming, rest and similar grouping that carries musical meaning (the composer's own choice for a passage). Grouping that is only the source edition's habit is a presentation matter. If the two cannot be told apart, ask a reviewer and report the decision.
    relations: { exception-of: [normalise.beam-grouping, normalise.rest-grouping] }
    examples:
      - situation: Bartok regroups the beams in one passage to show a metric shift.
        handling: Keep the grouping as printed.
      - situation: An edition beams every 6/8 bar the same way regardless of the music.
        handling: Normalise to the time-signature default.
    aliases: [TP8]

  - id: read.ornaments-as-printed
    theme: notation
    kind: obligation
    title: Ornaments as printed
    statement: Copy ornaments as printed, including the difference between acciaccatura and appoggiatura and the position before or after the main note. Where the tool cannot represent a detail, use the nearest available form in this order - type of ornament, then number of beams or strokes, then other indications.
    aliases: [TP12]

  # ---------------------------------------------------------------- encode
  - id: encode.real-objects
    theme: objects
    kind: obligation
    title: Real objects, not drawings or text
    statement: Encode ties, slurs, hairpins, spanning lines, tuplets, tremolo and grace notes as the musical objects they are, so that playback and export work. Do not draw them or type them as text.
    aliases: [TP13]

  - id: encode.defaults-not-overrides
    theme: defaults
    kind: obligation
    title: Defaults, not manual overrides
    statement: Use the tool's defaults for placement, stem direction, accidentals and similar. Avoid manual position offsets and flips.
    relations: { refines: [stance.meaning-over-appearance] }
    aliases: [TP14]

  - id: encode.layout-as-data
    theme: layout
    kind: obligation
    title: Source layout is removable data
    statement: Record the source's system and page breaks where possible, never split a bar across them, and keep them separable from the musical content so that they can be removed in one step. Where a source has no usable layout, omit them and say so.
    relations: { see-also: [normalise.page-geometry] }
    aliases: [TP16]

  # ---------------------------------------------------------------- normalise
  - id: normalise.closed-list
    theme: framework
    kind: obligation
    title: Normalisations are a closed list
    statement: Presentation normalisations are limited to those registered in this domain. A profile chooses which are permitted or required; local notes may not add to them. Each applied normalisation is stated once per transcription in the report.
    relations: { refines: [stance.meaning-over-appearance], requires: [declare.report-deviations] }
    aliases: [TP15]

  - id: normalise.beam-grouping
    theme: rhythm
    kind: permission
    title: Beam grouping
    statement: Beam grouping follows the time-signature default, except where grouping is composer-led.
    aliases: [TP15.1]

  - id: normalise.rest-grouping
    theme: rhythm
    kind: permission
    title: Rest grouping
    statement: Rest grouping follows the time-signature default, except where grouping is composer-led.
    aliases: [TP15.2]

  - id: normalise.tuplet-brackets
    theme: rhythm
    kind: permission
    title: Tuplet brackets
    statement: Tuplet brackets use a single standard form. Repeated tuplet numbers in a long group may be hidden but are kept in the data.
    aliases: [TP15.3]

  - id: normalise.tremolo
    theme: rhythm
    kind: permission
    title: Tremolo
    statement: A measured tremolo may use any semantically equivalent notation.
    aliases: [TP15.10]

  - id: normalise.stem-placement
    theme: signs
    kind: permission
    title: Stem and placement
    statement: Stem direction and similar placement is automatic.
    aliases: [TP15.4]

  - id: normalise.accidental-conventions
    theme: signs
    kind: permission
    title: Accidental conventions
    statement: Courtesy accidentals and cancelling naturals follow the default.
    aliases: [TP15.5]

  - id: normalise.clef
    theme: signs
    kind: permission
    title: Clefs
    statement: An unusual or obsolete clef may be replaced by its nearest modern equivalent; an octave-ambiguous clef is notated at sounding pitch; a brief clef change may be adapted for readability. Written pitch is unaffected.
    aliases: [TP15.6]

  - id: normalise.terms
    theme: words
    kind: permission
    title: Standard terms and abbreviations
    statement: Standard abbreviations and equivalent terms are normalised (for example one standard form for decrescendo and diminuendo); anything ambiguous is spelled out.
    aliases: [TP15.7]

  - id: normalise.spread-words
    theme: words
    kind: permission
    title: Words spread over several bars
    statement: A word spread over several bars or systems (for example cre - - scen - - do) is one spanning object with a start text and a continuation text.
    aliases: [TP15.8]

  - id: normalise.page-geometry
    theme: page
    kind: permission
    title: Page geometry and typography
    statement: Page geometry and typography follow defaults. The source's system and page breaks are kept as data.
    relations: { see-also: [encode.layout-as-data] }
    aliases: [TP15.9]

  # ---------------------------------------------------------------- declare
  - id: declare.mark-additions
    theme: additions
    kind: obligation
    title: Additions are rare and marked
    statement: Add only what is needed to express the source's own notational conventions in the encoding (for example accidentals that the source's convention leaves implicit). Mark every addition visibly. Translations of non-standard terms are additions. Anything that needs judgement is editorial, not an addition.
    relations: { refines: [stance.judgement-stays-out] }
    aliases: [TP17]

  - id: declare.report-deviations
    theme: reporting
    kind: obligation
    title: Report every unmarked deviation
    statement: Report every deviation that is not visibly marked. Differences caused by registered normalisations are stated once per transcription; specific interventions are listed one by one. The report, with the transcription, is enough to recover what the source prints.
    aliases: [TP18]

  - id: declare.record-provenance
    theme: provenance
    kind: obligation
    title: Record provenance
    statement: Record the source edition and file, the pages where the transcription appears, who transcribed and reviewed it, when, which tools were used, and the versions of the Principles, profile and notes applied.
    aliases: [TP19]
